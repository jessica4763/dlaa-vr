dataset:
  scene_names:
  - CBApocalypse
  - FloodedGrounds
  - ScifiBase
  - ScifiFacility
  - SunTemple
  training-input-img-path: ../data/training_data/QRISP/*/540p
  training-output-img-path: ../data/training_data/QRISP/*/540p
  ground-truth-path-suffix: Enhanced
  colour-path-suffix: MipBiasMinus1
  depth-path-suffix: DepthMipBiasMinus1
  camera-data-path-suffix: CameraData
  motion-vector-path-suffix: MotionVectorsMipBiasMinus1
loss: {}
optimiser:
  name: adamw
  actual-batch-size: 1
  virtual-batch-size: 8
  clip-size: 8
  epochs: 400
  learning-rate: 0.0001
  learning-rate-gamma: 0.5
  learning-rate-milestones:
  - 200
  - 300
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight-decay: 0.0001
setup:
  seed: 42
  saved-models-path: ../saved/models/full_model.pt
  tensorboard-dir: ../saved/logs/runs
  checkpoints-path: checkpoints
model:
  hidden-channels: 16
  num-blocks: 1
  parameters: null
