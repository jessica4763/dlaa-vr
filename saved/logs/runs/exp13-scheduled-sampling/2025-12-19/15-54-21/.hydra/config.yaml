dataset:
  scene_names:
  - CBApocalypse
  - FloodedGrounds
  - ScifiBase
  - ScifiFacility
  - SunTemple
  training-input-img-path: ../data/training_data/QRISP/*/270p/MipBiasMinus2Jittered
  training-output-img-path: ../data/training_data/QRISP/*/270p/Enhanced
loss: {}
optimiser:
  name: adamw
  batch-size: 8
  epochs: 100
  learning-rate: 0.0001
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  regularisation-parameter: 0.0001
  scheduled-sampling-epsilon: 0.0
  scheduled-sampling-k: 1.0
  scheduled-sampling-c: 0.001
setup:
  seed: 42
  saved-models-path: ../saved/models/full_model.pt
  tensorboard-dir: ../saved/logs/runs
model:
  hidden-channels: 32
  num-blocks: 3
  parameters: null
