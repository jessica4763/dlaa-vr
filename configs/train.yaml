defaults:
  - dataset: vr-mono-train-upscale  # train-upscale, vr-mono-train-upscale
  - optimiser: adamw

setup:
  seed: 42
  display-name: standard_hmd  # standard_fhd, standard_hmd
  jitter: true

paths:
  checkpoints-path: run/checkpoints
  sanity-checks-output-path: run/sanity_checks_output
  tensorboard-path: ../saved/logs/runs
  saved-models-path: ../saved/models/scale_model.pt
  training-checkpoint-path: ../saved/models/training_checkpoint.pt

model:
  hidden-channels: 16  # 16, 32, 64
  num-blocks: 1  # 1, 3, 5
  parameters: null
  save-interval: 10000

validation:
  is-vr: true  # true, false
  proxy-validation-interval: 1000
  primary-validation-interval: 10000
  proxy-validation-length: 150    # Only applies to a VR validation dataset
  primary-validation-length: 600  # Only applies to a VR validation dataset

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
