---
defaults:
  - dataset: full-train-upscale
  - optimiser: adamw

setup:
  seed: 42
  display-name: standard_fhd  # standard_fhd, standard_hmd
  jitter: true

paths:
  checkpoints-path: checkpoints
  sanity-checks-output-path: sanity_checks_output
  tensorboard-path: ../saved/logs/runs
  saved-models-path: ../saved/models/full_model.pt

model:
  hidden-channels: 64
  num-blocks: 5
  parameters: null  # ../saved/logs/runs/[category]/[exp]/[model]

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
