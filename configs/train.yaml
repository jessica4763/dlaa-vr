---
defaults:
  - dataset: toy-train
  - loss: l1
  - optimiser: adamw

setup:
  seed: 42
  saved-models-path: ../saved/models/toy_model.pt
  tensorboard-dir: ../saved/logs/runs
  checkpoints-path: checkpoints

model:
  hidden-channels: 16
  num-blocks: 1
  parameters:

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
