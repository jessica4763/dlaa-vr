---
defaults:
  - dataset: toy-train
  - loss: l1
  - optimiser: adamw

setup:
  seed: 42
  saved-models-path: ../saved/models/toy_model.pt
  tensorboard-dir: ../saved/logs/runs

model:
  hidden-channels: 32
  num-blocks: 3
  parameters: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
