---
defaults:
  - dataset: toy-train
  - loss: l1
  - optimiser: sgd

setup:
  seed: 42
  shuffle: true
  saved-models-path: ../saved/models/toy_model.pt

model:
  hidden-channels: 16
  num-blocks: 1
  parameters: null

logging:
  tensorboard-dir: ../saved/logs/runs

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
