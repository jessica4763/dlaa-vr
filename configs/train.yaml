---
defaults:
  - dataset: full-train
  - loss: l1
  - optimiser: adamw

setup:
  seed: 42
  shuffle: true
  saved-models-path: ../saved/models/full_model.pt

model:
  hidden-channels: 32
  num-blocks: 3
  parameters: null

logging:
  tensorboard-dir: ../saved/logs/runs

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
