---
defaults:
  - dataset: full-train
  - optimiser: adamw

setup:
  seed: 42
  display-name: standard_fhd
  jitter: true
  saved-models-path: ../saved/models/full_model.pt
  tensorboard-dir: ../saved/logs/runs
  checkpoints-path: checkpoints
  sanity-checks-output-path: sanity_checks_output

model:
  hidden-channels: 64
  num-blocks: 5
  parameters: # ../saved/logs/runs/[exp]/[model]

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
