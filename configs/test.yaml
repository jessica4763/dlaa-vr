defaults:
  - datasets: toy-test-upscale
  - _self_

setup:
  seed: 42
  display-name: standard_fhd  # standard_fhd, standard_hmd
  jitter: true

paths: 
  evaluation-output-path: evaluation_outputs
  tensorboard-path: ../saved/logs/runs
  saved-models-path: ../saved/logs/runs/2x/exp2/full_model.pt

model:
  hidden-channels: 64
  num-blocks: 5

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
