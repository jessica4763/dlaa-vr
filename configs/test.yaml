---
defaults:
  - dataset: toy-test-upscale

setup:
  seed: 42
  display-name: standard_fhd  # standard_fhd, standard_hmd
  jitter: true

paths: 
  saved-models-path: ../saved/logs/runs/2x/exp4/full_model.pt
  evaluation-output-path: evaluation_outputs
  tensorboard-path: ../saved/logs/runs

model:
  hidden-channels: 64
  num-blocks: 5

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
