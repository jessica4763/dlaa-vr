defaults:
  - dataset: vr-train-upscale
  - optimiser: adamw

setup:
  seed: 42
  display-name: standard_hmd  # standard_fhd, standard_hmd
  jitter: false

paths:
  checkpoints-path: run/vr_checkpoints
  sanity-checks-output-path: run/vr_sanity_checks_output
  tensorboard-path: ../saved/logs/runs
  saved-models-path: ../saved/models/vr_scale_model.pt
  training-checkpoint-path: ../saved/models/vr_training_checkpoint.pt

model:
  hidden-channels: 16  # 16, 32, 64
  num-blocks: 1  # 1, 3, 5
  parameters: null  # ../saved/logs/runs/[category]/[exp]/[model]

validation:
  proxy-validation-interval: 1000
  primary-validation-interval: 10000

hydra:
  run:
    dir: hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
