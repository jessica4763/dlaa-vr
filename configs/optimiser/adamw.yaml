---
name: adamw
loss: l1loss  # l1loss, cvvdploss, l1loss_with_cvvdp
cvvdp-weight: 0.01
actual-batch-size: 8
virtual-batch-size: 8
clip-size: 16
patch-size: 264
padding: 0
iterations: 125000  # 500000 for QRISP, 125000 for VR_mono
lr-scheduler: multi-step  # multi-step, cosine-annealing

# MultiStepLR
# l1loss: 1e-4 for training, 2.5e-5 for fine-tuning | 5e-5 for training for VR, 1.25e-5 for fine-tuning for VR
# cvvdploss: 1e-5 for training
learning-rate: 1e-4
learning-rate-gamma: 0.5
learning-rate-milestones: [50000, 100000]  # [200000, 400000] for QRISP, [50000, 100000] for VR_mono, [] for fine-tuning 

# CosineAnnealingLR
learning-rate-eta-min: 2.5e-5

betas: [0.9, 0.999]
epsilon: 1e-8
weight-decay: 0
